{% extends "base.html" %}

{% block content %}
{% if request.query_params.get('account_deleted') == '1' %}
<p class="flash-message" role="status">Your Woodchuck account has been deleted.</p>
{% endif %}
<section
  class="card hero-card welcome-hero"
  aria-label="Woodchuck companion hero art"
>
  <img
    class="welcome-hero-art"
    src="/static/img/landing-painting.png"
    alt=""
    aria-hidden="true"
  />
  <div class="welcome-hero-content">
    <div class="button-row welcome-button-row">
      <a class="btn welcome-enter-button" href="/home" data-requires-profile="true">Enter Your Woodshed</a>
      <a class="btn btn-primary" href="/setup">Create Your Woodchuck</a>
      <a class="btn btn-secondary" href="/login">Sign In from New Device</a>
      <a class="btn btn-red" href="/p-book" data-requires-profile="true">P-Chart Quick Submit</a>
    </div>
  </div>
</section>
{% endblock %}
