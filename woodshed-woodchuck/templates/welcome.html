{% extends "base.html" %}

{% block content %}
<section class="card hero-card">
  <div>
    <p class="chip">Music companion game demo</p>
    <div class="button-row">
      <a class="btn btn-primary" href="/setup">Create a Woodchuck</a>
      <a class="btn btn-secondary" href="/home" data-requires-profile="true">Back to the Woodshed</a>
      <a class="btn btn-red" href="/home#p-book" data-requires-profile="true">P-Chart Quick Submit</a>
    </div>
    <p class="body-copy">
      Build a musical world. Practice in real life and watch your Woodchuck grow! The Viking Sax is there to help.
    </p>
  </div>
  <aside class="art-frame" aria-label="Woodchuck hero art">
    <img class="character-art" src="/static/img/woodchuck-hero.png" alt="Woodchuck companion hero art" />
  </aside>
</section>
{% endblock %}
