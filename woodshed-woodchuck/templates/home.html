{% extends "base.html" %}

{% block content %}
<section class="card woodshed-page">
  <p class="body-copy woodshed-intro">
    Tap around the room to practice, check your quest, tune up, visit the store, or rest your Woodchuck.
  </p>

  <div class="woodshed-scene" aria-label="Interactive Woodshed room">
    <div class="woodshed-character-layer" aria-label="Woodchuck holding selected instrument">
      <img
        class="character-art woodshed-character-art"
        src="/static/img/woodchuck-home.png"
        alt="Woodchuck holding an instrument in the Woodshed"
      />
    </div>

    <div class="woodshed-foreground" aria-label="Clickable Woodshed objects">
      <div class="woodshed-object-column woodshed-object-column-left">
        <div
          id="woodchuck-name-value"
          class="shed-readout shed-readout-name"
          title="Woodchuck name"
        >
          Name your Woodchuck
        </div>

        <div
          id="camp-level-value"
          class="shed-readout shed-readout-class"
          title="Class"
        >
          Chuckling
        </div>

        <div
          id="instrument-object"
          class="shed-icon-object"
          role="img"
          aria-label="Instrument"
          title="Instrument"
        >
          🎷
        </div>

        <div
          id="level-value"
          class="shed-readout shed-readout-level"
          title="Level"
        >
          #1
        </div>

        <a
          id="p-book"
          class="room-object p-book-object"
          href="/p-book"
          aria-label="Open P-Chart Book"
          title="P-Chart Book"
        >
          <span class="room-object-icon" aria-hidden="true">📓</span>
        </a>

        <a
          class="room-object quest-object"
          href="/quest"
          aria-label="Open Quest Book"
          title="Quest Book"
        >
          <span class="room-object-icon" aria-hidden="true">📕</span>
        </a>
      </div>

      <div
        class="woodshed-object-column woodshed-object-column-center"
        aria-hidden="true"
      ></div>

      <div class="woodshed-object-column woodshed-object-column-right">
        <div
          id="streak-value"
          class="shed-readout"
          title="Practice streak"
        >
          0
        </div>

        <div
          id="total-p-charts-value"
          class="shed-readout"
          title="Total P-Charts"
        >
          0
        </div>

        <a
          id="dandelion-object"
          class="room-object dandelion-object"
          href="/store"
          aria-label="Open the shop"
          title="Dandelions and Shop"
        >
          <span class="room-object-icon" aria-hidden="true">🌼</span>
          <span id="credits-value" class="dandelion-count">0</span>
        </a>

        <a
          class="room-object metronome-object"
          href="#metronome"
          aria-label="Open metronome"
          title="Metronome"
        >
          <span class="room-object-icon" aria-hidden="true">🕰️</span>
        </a>

        <a
          class="room-object tuner-object"
          href="#tuner"
          aria-label="Open tuner"
          title="Tuner"
        >
          <span class="room-object-icon" aria-hidden="true">🔱</span>
        </a>

        <a
          class="room-object chair-object"
          href="#chair"
          aria-label="Rest in the chair"
          title="Chair"
        >
          <span class="room-object-icon" aria-hidden="true">🪑</span>
        </a>
      </div>
    </div>
  </div>

  <p class="support-line">
    <a
      href="https://venmo.com/u/jeffriley101"
      target="_blank"
      rel="noopener noreferrer"
    >
      Please Support the Shed Project!
    </a>
  </p>
</section>
{% endblock %}
