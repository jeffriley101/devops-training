<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · Woodshed Woodchuck</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=69" />

  <!-- Woodshed app icons -->
  <link
    rel="manifest"
    href="/static/manifest.webmanifest?v=4"
  />
  <meta name="theme-color" content="#6b3f1f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-title"
    content="Woodshed"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/static/img/woodshed-woodchuck-pwa-icons/apple-touch-icon.png?v=3"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/static/img/woodshed-woodchuck-pwa-icons/favicon-32.png?v=3"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/static/img/woodshed-woodchuck-pwa-icons/favicon-16.png?v=3"
  />
  <!-- End Woodshed app icons -->
</head>
<body{% if page_class %} class="{{ page_class }}"{% endif %}>
  <div class="bg-orbs" aria-hidden="true"></div>
  <div class="app-shell">
    <main class="content-wrap">
      {% block content %}{% endblock %}
    </main>

    {% if nav_items and active_nav %}
    <div class="sound-effects-controls">
      <button id="sound-effects-button" class="sound-effects-button" type="button" aria-label="Sound Effects On. Open settings." aria-controls="sound-effects-panel" aria-expanded="false">🔊</button>
      <div id="sound-effects-panel" class="sound-effects-panel" hidden>
        <label class="sound-effects-toggle" for="sound-effects-enabled">
          <span>Sound Effects</span>
          <input id="sound-effects-enabled" type="checkbox" checked />
        </label>
        <label for="sound-effects-volume">Volume <output id="sound-effects-volume-value" for="sound-effects-volume">35%</output></label>
        <input id="sound-effects-volume" type="range" min="0" max="100" step="1" value="35" aria-label="Sound Effects volume" aria-valuetext="35 percent" />
      </div>
    </div>
    <nav class="main-nav" aria-label="Primary navigation">
      {% for item in nav_items %}
      <a class="nav-pill {% if item.key == active_nav %}active{% endif %}" href="{{ item.href }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
    {% endif %}
  </div>

  <script id="quest-pool-data" type="application/json">{{ quest_pool | tojson }}</script>
  <script id="sax-viking-messages-data" type="application/json">{{ sax_viking_messages | tojson }}</script>
  <script id="instrument-definitions-data" type="application/json">{{ instrument_definitions | tojson }}</script>
  <script id="account-state-bootstrap" type="application/json">{{ account_state_bootstrap | tojson }}</script>
  <script src="/static/js/state.js?v=7"></script>
  <script src="/static/js/instruments.js?v=3"></script>
  <script src="/static/vendor/tone/Tone.js?v=15.1.22"></script>
  <script src="/static/js/audio.js?v=4"></script>
  <script src="/static/js/app.js?v=34"></script>
  <script src="/static/js/account.js?v=12"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
