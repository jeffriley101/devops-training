<dialog id="game-mode-entry" class="woodchuck-editor" data-profile-surface data-auto="{{ 'true' if game_mode_entry else 'false' }}" aria-labelledby="game-mode-entry-title">
  <h2 id="game-mode-entry-title">Choose your Game Mode</h2>
  <p>Choose how you want to practice. You can change this later in your profile, or keep exploring and choose later.</p>
  <p>Current Game Mode: <span id="game-mode-entry-current">Not selected</span></p>
  <form id="game-mode-entry-form" class="stack-form">
    <label for="game-mode-entry-select">Game Mode</label>
    <select id="game-mode-entry-select" name="game_mode" required>
      <option value="">Choose a Game Mode</option>
      {% for mode in game_modes %}<option value="{{ mode }}">{{ mode }}</option>{% endfor %}
    </select>
    <p id="game-mode-entry-feedback" role="status" aria-live="polite"></p>
    <div class="button-row">
      <button type="submit" class="btn btn-primary">Save Game Mode</button>
      <button type="button" class="btn btn-secondary" data-surface-close>Choose later</button>
    </div>
  </form>
</dialog>
