  <section id="login-streak-card" class="login-streak-card" aria-labelledby="login-streak-title">
    <div class="login-streak-summary">
      <span class="login-streak-icon" aria-hidden="true">🔥</span>
      <div>
        <h3 id="login-streak-title">Daily Login Streak</h3>
        <p>Day <span id="login-streak-days">—</span></p>
        <p id="login-streak-status" role="status" aria-live="polite">Checking today’s streak…</p>
      </div>
    </div>
    <div class="login-streak-crown-progress">
      <span aria-hidden="true">👑</span>
      <progress id="login-streak-progress" max="7" value="0" aria-label="Progress toward the next weekly streak crown">0 of 7 days</progress>
      <span id="login-streak-progress-text">0 / 7</span>
    </div>
  </section>
