<p>Game Mode: <span id="practice-tools-mode">Not selected</span></p>
<label for="metronome-volume">Volume</label><input id="metronome-volume" type="range" min="0" max="1" step="0.01" value="0.35" />
<div id="metronome-mode-controls" hidden>
  <label for="metronome-subdivision">Subdivision</label><select id="metronome-subdivision"><option value="1">Off</option><option value="2">2</option><option value="3">3 · Triplet</option></select>
  <label for="metronome-meter">Meter</label><select id="metronome-meter"><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option><option value="6">6/8 · Eighth-note pulse</option></select>
  <label for="metronome-sound">Sound</label><select id="metronome-sound"><option>Click</option><option>Clave</option><option>Snap</option></select>
</div>
