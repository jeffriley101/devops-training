{% extends "base.html" %}

{% block content %}
<section class="card">
  <div class="section-head">
    <h2>Woodchuck Store</h2>
    <p class="body-copy">Trade practice dandelions on simple gear for your Woodchuck.</p>
  </div>

  <div class="stats-grid">
    <article class="stat-card">
      <h3>Bank</h3>
      <p><span id="store-credits-value">0</span> dandelions</p>
    </article>
    <article class="stat-card">
      <h3>Hat</h3>
      <p id="equipped-head-value">None</p>
    </article>
    <article class="stat-card">
      <h3>Hoodie</h3>
      <p id="equipped-body-value">None</p>
    </article>
  </div>

  <article class="mentor-card mt-md">
    <p class="chip">The Viking Sax says</p>
    <p id="store-feedback">Earn dandelions by practicing, then pick something for your Woodchuck.</p>
  </article>

  <div id="store-items" class="store-item-grid mt-md" aria-label="Store items"></div>
</section>
{% endblock %}
