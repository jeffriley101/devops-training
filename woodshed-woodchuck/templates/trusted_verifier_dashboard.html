{% extends "base.html" %}

{% block content %}
<section class="card">
  <div class="section-head">
    <p class="chip">Trusted Verifier</p>
    <h2 id="verifier-dashboard-title">
      Your Musicians
    </h2>

    <p
      id="verifier-dashboard-email"
      class="body-copy"
    ></p>
  </div>

  <div
    id="verifier-student-list"
    class="stack-form"
    aria-live="polite"
  >
    <p class="body-copy">Loading connected musicians...</p>
  </div>

  <p
    id="verifier-dashboard-error"
    class="error-text"
    aria-live="polite"
  ></p>

  <div class="button-row">
    <button
      id="trusted-verifier-logout-button"
      class="btn btn-secondary"
      type="button"
    >
      Sign Out
    </button>
  </div>
</section>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/trusted-verifier-dashboard.js?v=1"></script>
{% endblock %}
